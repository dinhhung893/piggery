name: track-upstream

# Weekly cron: check upstream for a new release tag, try to apply the winport
# patch automatically on top of it, and open a PR (clean) or an issue (conflict).
# NEVER publishes a release — Frank merges the PR, then pushes the tag, which
# triggers build-windows.yml.
#
# PREREQUISITE: the patch file must exist in this fork at docs/winport-series/
# (one-time setup per SETUP.md) — the workflow stashes it to $RUNNER_TEMP,
# because the automation branch starts from the pristine upstream tag.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM_REPO: sting8k/piggery
  PATCH_PATH: docs/winport-series/0001-winport-windows-amd64-port-of-v0.5.3-build-tag-split.patch

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stash patch outside the working tree
        run: |
          set -euo pipefail
          # The fork default branch carries the patch; the automation branch below
          # starts from the upstream tag, which does NOT contain it.
          test -f "$PATCH_PATH"
          cp "$PATCH_PATH" "$RUNNER_TEMP/winport.patch"
          echo "patch stashed ($(wc -l < "$RUNNER_TEMP/winport.patch") lines)"

      - name: Resolve latest upstream tag
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --tags --quiet
          # gh release view (not `git tag --merged upstream/HEAD`): the remote HEAD
          # ref is not created by fetch --tags and releases are the real trigger.
          LATEST=$(gh release view --repo "$UPSTREAM_REPO" --json tagName -q .tagName)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Upstream latest tag: $LATEST"

          BRANCH="automation/winport-rebase-$LATEST"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          # Skip if we already handled this tag (open PR or issue mentioning it)
          if gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "$LATEST in:title" | grep -q .; then
            echo "PR for $LATEST already open — nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$LATEST in:title" | grep -q .; then
            echo "Issue for $LATEST already open — nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Try automated rebase onto the new tag
        if: steps.detect.outputs.skip == 'false'
        id: rebase
        run: |
          set -uo pipefail
          # Start from the pristine upstream tag — NOT fork main, which already
          # carries the winport state (applying the patch there would no-op).
          git config user.name "winport-automation"
          git config user.email "winport-automation@users.noreply.github.com"
          git checkout -b "${{ steps.detect.outputs.branch }}" "${{ steps.detect.outputs.latest }}"

          echo "--- git apply --3way ---"
          if git apply --3way "$RUNNER_TEMP/winport.patch"; then
            echo "apply=ok" >> "$GITHUB_OUTPUT"
          else
            git apply --3way "$RUNNER_TEMP/winport.patch" > apply.log 2>&1 || true
            {
              echo "### git apply --3way output"
              echo '```'
              cat apply.log
              echo '```'
              echo "### git status"
              echo '```'
              git status --short
              echo '```'
              echo "### git diff --stat (partial)"
              echo '```'
              git diff --stat
              echo '```'
            } > conflict-report.md
            echo "apply=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.rebase.outputs.apply == 'ok'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Gate 1 — linux build (no unix behavior change)
        if: steps.rebase.outputs.apply == 'ok'
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux go build ./cmd/piggery
          echo "linux build: PASS" > gate-report.md

      - name: Gate 2 — windows build
        if: steps.rebase.outputs.apply == 'ok'
        run: |
          set -euo pipefail
          VERSION="${{ steps.detect.outputs.latest }}+winport"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -ldflags "-X github.com/sting8k/piggery/internal/cli.Version=${VERSION}" \
            -o piggery-windows-amd64.exe ./cmd/piggery
          SHA=$(sha256sum piggery-windows-amd64.exe | cut -d' ' -f1)
          {
            echo "windows build: PASS (${VERSION})"
            echo "binary sha256: \`$SHA\`"
          } >> gate-report.md
          rm piggery-windows-amd64.exe # the release build happens in build-windows.yml

      - name: Open PR (clean rebase)
        if: steps.rebase.outputs.apply == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.detect.outputs.latest }}
          BRANCH: ${{ steps.detect.outputs.branch }}
        run: |
          git add -A
          git commit -m "winport: apply patch series onto ${LATEST}"
          git push origin "$BRANCH"
          {
            echo "${LATEST}+winport ready — review & merge"
            echo ""
            echo "All gates passed on the automation branch:"
            echo ""
            cat gate-report.md
            echo ""
            echo "## To release"
            echo "1. Review the diff (especially upstream changes touching winported files)."
            echo "2. Merge this PR into \`main\`."
            echo "3. Push tag \`${LATEST}+winport\` → build-windows.yml publishes the release asset."
            echo "4. On the machine: run scripts/update-piggery.ps1"
          } > pr-body.md
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" \
            --title "${LATEST}+winport ready — review & merge" \
            --body-file pr-body.md

      - name: Open issue (conflict — manual rebase needed)
        if: steps.rebase.outputs.apply == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.detect.outputs.latest }}
        run: |
          {
            echo "${LATEST} needs manual winport rebase"
            echo ""
            echo "The winport patch does NOT apply cleanly onto ${LATEST}."
            echo "Checkout the tag locally, resolve the conflicts with an agent session,"
            echo "then push the tag when verified."
            echo ""
            cat conflict-report.md
          } > issue-body.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "${LATEST} needs manual winport rebase" \
            --body-file issue-body.md
