name: build-windows

# Builds the Windows binary and publishes a fork release when Frank pushes a
# tag matching vX.Y.Z+winport (after merging an automation PR from
# track-upstream.yml, or manually). This is the ONLY workflow that publishes.

on:
  push:
    tags:
      - "v*+winport"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Gate — linux build must pass before publishing windows
        shell: bash
        run: CGO_ENABLED=0 GOOS=linux go build ./cmd/piggery

      - name: Extract version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build windows-amd64
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          CGO_ENABLED=0 GOOS=windows GOARmd64 \
            go build -trimpath -ldflags "-X github.com/sting8k/piggery/internal/cli.Version=${VERSION}" \
            -o piggery-windows-amd64.exe ./cmd/piggery
          sha256sum piggery-windows-amd64.exe | tee piggery-windows-amd64.exe.sha256

      - name: Smoke — binary reports its version
        shell: bash
        run: ./piggery-windows-amd64.exe --version | grep -F "${{ steps.ver.outputs.version }}"

      - name: Publish release on the fork
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          body: |
            Windows-amd64 build of ${{ steps.ver.outputs.version }} (winport patch series).
            Install/update on machine: run scripts/update-piggery.ps1 from the winport-pipeline folder.
          files: |
            piggery-windows-amd64.exe
            piggery-windows-amd64.exe.sha256
